name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck on pure .sh files (skip .tmpl)
        run: |
          find . -name '*.sh' \
            -not -path './.git/*' \
            -not -name '*.tmpl' \
            -print0 \
          | xargs -0 shellcheck

  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all .sh files have valid bash syntax
        run: |
          find . -name '*.sh' \
            -not -path './.git/*' \
            -not -name '*.tmpl' \
            -print0 \
          | xargs -0 -I{} bash -n {}
